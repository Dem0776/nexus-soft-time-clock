# =====================================================================
# NGINX — reverse proxy del stack local.
# Enruta el portal (/) y la API (/api, /actuator, /swagger) al backend.
# En producción: TLS con cert-manager en el Ingress (ADR/despliegue).
# =====================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Rate limiting perimetral (RNF-07). La app aplica límites finos con Redis.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream backend { server backend:8080; }
    upstream web     { server web:80; }
    upstream minio   { server minio:9000; }

    server {
        listen 80;
        server_name _;

        # Portal Angular (PWA)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API REST + Actuator + OpenAPI
        location ~ ^/(api|actuator|v3/api-docs|swagger-ui) {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Evidencias fotográficas (RF-18): passthrough a MinIO para que las URLs prefirmadas
        # que emite el backend sean alcanzables desde el móvil y el portal.
        #
        # El bucket se llama "evidence" igual que este prefijo de ruta, así que NO hay rewrite:
        # el path que firma el backend y el que recibe MinIO son idénticos. Cuidado al tocar esto,
        # porque una firma SigV4 rota se manifiesta como un opaco "SignatureDoesNotMatch":
        #   - $http_host (no $host): la firma incluye el puerto, y $host lo descarta.
        #   - sin barra final en proxy_pass: la añadiría recortando el prefijo.
        #   - sin limit_req de la zona "api": estrangularía las subidas junto con la API.
        location /evidence/ {
            proxy_pass http://minio;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # El default de client_max_body_size es 1 MB: una foto de evidencia daría 413.
            client_max_body_size 3m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket (tiempo real, STOMP)
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}

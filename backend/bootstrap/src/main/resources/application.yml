# =====================================================================
# Configuración base — Nexus Soft Time Clock backend
# Todo valor sensible/ambiental se inyecta por variable de entorno (12-factor).
# =====================================================================
spring:
  application:
    name: nexus-time-clock

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none                # Flyway es dueño del esquema (tipos PostGIS/citext).
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 60s   # KPIs del dashboard cacheados 60s (RNF-01)

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework   # respeta X-Forwarded-* tras NGINX (TLS termination)

# Firma del access token (RS256). En producción inyecta un par RSA persistente por env
# (PEM PKCS#8 privada + X.509 pública); si se omite, se genera uno en memoria al arrancar
# (solo dev: invalida los tokens en cada reinicio). Genéralo una vez, p. ej.:
#   openssl genpkey -algorithm RSA -pkcs8 -out jwt-private.pem -pkeyopt rsa_keygen_bits:2048
#   openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem
security:
  jwt:
    private-key: ${SECURITY_JWT_PRIVATE_KEY:}   # contenido PEM PKCS#8 de la llave privada
    public-key: ${SECURITY_JWT_PUBLIC_KEY:}     # contenido PEM X.509 de la llave pública
    key-id: ${SECURITY_JWT_KEY_ID:nexus-rsa}
    access-ttl-seconds: ${SECURITY_JWT_ACCESS_TTL_SECONDS:900}   # vida del access token (15 min)
    refresh-ttl-days: ${SECURITY_JWT_REFRESH_TTL_DAYS:30}        # vida del refresh token (ventana deslizante)

# Observabilidad (Prometheus/Grafana, RNF-11)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true                 # liveness/readiness para Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.condor.nexussoft.timeclock: ${LOG_LEVEL_APP:DEBUG}
